<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Listings | Placement Cell</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="navbar">
    <h2>Job Listings</h2>
    <button onclick="history.back()">Back</button>
  </div>

  <div class="container">
    <div id="job-cards" class="card-grid"></div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    const renderJobs = (jobs) => {
      document.getElementById('job-cards').innerHTML = jobs.map(job => `
        <div class="card">
          <h3>${job.company_name}</h3>
          <p><strong>Skills:</strong> ${job.skills || '-'}</p>
          <p><strong>Salary:</strong> ${job.salary || '-'}</p>
          <p><strong>Last Date:</strong> ${job.last_date || '-'}</p>
          <button onclick="api.applyJob(${job.id})">Apply</button>
        </div>
      `).join('');
    };
    api.getJobs().then(renderJobs);
  </script>
</body>
</html>
