<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | Placement Cell</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="navbar">
    <h2>Placement Cell - Student</h2>
    <button onclick="api.logout()">Logout</button>
  </div>
  <div class="container">
    <h3>Profile</h3>
    <div id="student-profile"></div>
    <form id="profile-form" class="flex" style="margin-top:1rem;">
      <input type="text" name="name" placeholder="Update Name" />
      <input type="text" name="branch" placeholder="Branch" />
      <input type="number" step="0.01" name="cgpa" placeholder="CGPA" />
      <button type="submit">Save Profile</button>
    </form>
    <form id="resume-form" style="margin-top:1rem;">
      <input type="file" name="resume" accept=".pdf,.doc,.docx" required />
      <button type="submit">Upload Resume</button>
    </form>
  </div>

  <div class="container">
    <h3>Companies</h3>
    <div id="companies-list" class="card-grid"></div>
  </div>

  <div class="container">
    <h3>Job Listings</h3>
    <div id="jobs-list" class="card-grid"></div>
  </div>

  <div class="container">
    <h3>Application Status</h3>
    <table class="table">
      <thead>
        <tr>
          <th>Company</th>
          <th>Skills</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="application-status"></tbody>
    </table>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/student.js"></script>
  <script>
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target).entries());
      await api.updateProfile(payload);
      alert('Profile updated');
      initStudent();
    });

    document.getElementById('resume-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const token = localStorage.getItem('pcms_token');
      const res = await fetch('http://localhost:5000/api/student/upload-resume', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: formData,
      });
      if (res.ok) {
        alert('Resume uploaded');
        initStudent();
      } else {
        alert('Upload failed');
      }
    });
  </script>
</body>
</html>
